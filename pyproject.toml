[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fluid-voice"
version = "0.1.0"
description = "Lightweight, ultra-fast Windows Hinglish dictation tool powered by Groq Whisper API."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "FluidVoice Team" }
]
dependencies = [
    "PyQt6>=6.5.0",
    "keyring>=24.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "pynput>=1.7.6",
    "pyautogui>=0.9.54",
    "pywin32>=306; sys_platform == 'win32'"
]

[project.scripts]
fluid-voice = "fluid_voice.__main__:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
pythonpath = ["."]
