<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Account Settings - Velo AI</title>
<script src="../tailwind.js"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {

                      "inverse-primary": "#b4c5ff",
                      "tertiary": "#943700",

                      "surface-container-low": "#f2f4f6",
                      "on-tertiary-container": "#ffede6",
                      "surface-container": "#eceef0",
                      "surface-bright": "#f7f9fb",
                      "tertiary-fixed-dim": "#ffb596",
                      "on-primary-fixed-variant": "#003ea8",
                      "on-primary-fixed": "#00174b",
                      "secondary": "#4648d4",
                      "on-error": "#ffffff",
                      "surface-tint": "#0053db",
                      "surface-container-high": "#e6e8ea",
                      "on-tertiary": "#ffffff",
                      "surface": "#f7f9fb",
                      "primary-container": "#2563eb",
                      "on-tertiary-fixed": "#360f00",
                      "on-surface": "#191c1e",
                      "primary-fixed-dim": "#b4c5ff",
                      "secondary-container": "#6063ee",
                      "outline-variant": "#c3c6d7",
                      "on-error-container": "#93000a",
                      "tertiary-container": "#bc4800",
                      "on-surface-variant": "#434655",
                      "on-primary": "#ffffff",
                      "on-primary-container": "#eeefff",
                      "inverse-surface": "#2d3133",
                      "surface-container-highest": "#e0e3e5",
                      "primary-fixed": "#dbe1ff",
                      "error-container": "#ffdad6",
                      "surface-container-lowest": "#ffffff",
                      "error": "#ba1a1a",
                      "on-secondary-fixed": "#07006c",
                      "surface-variant": "#e0e3e5",
                      "on-background": "#191c1e",
                      "background": "#f7f9fb",
                      "primary": "#004ac6",
                      "on-tertiary-fixed-variant": "#7d2d00",
                      "on-secondary-container": "#fffbff",
                      "on-secondary": "#ffffff",
                      "inverse-on-surface": "#eff1f3",
                      "on-secondary-fixed-variant": "#2f2ebe",
                      "tertiary-fixed": "#ffdbcd",
                      "secondary-fixed": "#e1e0ff",
                      "outline": "#737686"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xs": "8px",
                      "base": "4px",
                      "xl": "32px",
                      "gutter": "20px",
                      "lg": "24px",
                      "container-max": "1280px",
                      "sm": "12px",
                      "md": "16px"
              },
              "fontFamily": {
                      "label-caps": ["Geist"],
                      "headline-lg-mobile": ["Inter"],
                      "body-sm": ["Inter"],
                      "title-md": ["Inter"],
                      "headline-lg": ["Inter"],
                      "headline-xl": ["Inter"],
                      "body-lg": ["Inter"],
                      "mono-data": ["Geist"]
              },
              "fontSize": {
                      "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "title-md": ["18px", {"lineHeight": "26px", "fontWeight": "600"}],

          }

<style>
        body { background-color: #e0e3e5; /* Simulating blurred app background */ }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-md sm:p-lg antialiased bg-surface">
<!-- Modal Container -->
<div class="w-full max-w-4xl bg-surface-container-lowest rounded-xl flex flex-col md:flex-row overflow-hidden relative" style="box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05); min-height: 600px;">
<!-- Left Sidebar Sub-nav -->
<aside class="w-full md:w-64 bg-surface-bright border-r border-outline-variant/50 flex flex-col p-lg shrink-0">
<div class="mb-lg">
<h3 class="font-label-caps text-label-caps text-outline uppercase tracking-wider mb-sm">Settings</h3>
<nav class="flex flex-col gap-base">
<button class="flex items-center gap-sm px-md py-sm rounded-lg w-full text-left font-body-sm text-body-sm text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200">
<span aria-hidden="true" class="material-symbols-outlined text-[20px]">tune</span>
                        General
                    </button>
</nav>
</div>
<div>
<h3 class="font-label-caps text-label-caps text-outline uppercase tracking-wider mb-sm">Account</h3>
<nav class="flex flex-col gap-base">
<!-- Active State -->
<button class="flex items-center gap-sm px-md py-sm rounded-lg w-full text-left font-body-sm text-body-sm bg-secondary-fixed text-on-secondary-fixed border-l-4 border-primary font-semibold transition-colors duration-200">
<span aria-hidden="true" class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">person</span>
                        Account
                    </button>
</nav>
</div>
<div class="mt-auto pt-lg border-t border-outline-variant/30 flex justify-between items-center text-outline font-label-caps text-label-caps">
<span class="">Velo AI v2.1.0</span>
</div>
</aside>
<!-- Right Content Area -->
<main class="flex-1 p-lg md:p-xl flex flex-col bg-surface-container-lowest relative">
<header class="mb-xl">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Account</h1>
</header>
<!-- Settings Form Card -->
<div class="bg-surface rounded-xl p-lg md:p-xl border border-outline-variant/40 flex flex-col gap-lg flex-1">
<!-- Field: First Name -->
<div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-outline-variant/30 pb-md gap-sm">
<label class="font-body-sm text-body-sm text-on-surface font-medium sm:w-1/3">First name</label>
<div class="sm:w-2/3 max-w-[320px]">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded px-sm py-[6px] font-body-sm text-body-sm text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" type="text" value="stefina">
</div>
</div>
<!-- Field: Last Name -->
<div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-outline-variant/30 pb-md gap-sm">
<label class="font-body-sm text-body-sm text-on-surface font-medium sm:w-1/3">Last name</label>
<div class="sm:w-2/3 max-w-[320px]">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded px-sm py-[6px] font-body-sm text-body-sm text-on-surface focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" type="text" value="buderi">
</div>
</div>
<!-- Field: Email -->
<div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-outline-variant/30 pb-md gap-sm">
<label class="font-body-sm text-body-sm text-on-surface font-medium sm:w-1/3">Email</label>
<div class="sm:w-2/3 max-w-[320px] font-body-sm text-body-sm text-on-surface-variant">
                        buderistefina@gmail.com
                    </div>
</div>
<!-- Field: Profile Picture -->
<div class="flex flex-col sm:flex-row sm:items-center justify-between pt-xs gap-sm">
<label class="font-body-sm text-body-sm text-on-surface font-medium sm:w-1/3">Profile picture</label>
<div class="sm:w-2/3 max-w-[320px] flex justify-end">
<div class="w-10 h-10 rounded-full bg-outline text-surface-container-lowest flex items-center justify-center font-title-md text-title-md shrink-0">
                            s
                        </div>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="mt-xl flex flex-col sm:flex-row justify-between items-center gap-md">
<button class="px-md py-sm rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface font-body-sm text-body-sm font-medium transition-colors w-full sm:w-auto">
                    Sign out
                </button>
<div class="flex flex-col sm:flex-row gap-md items-center w-full sm:w-auto">
<button class="font-body-sm text-body-sm text-on-surface-variant hover:text-error transition-colors px-md py-sm">
                        Delete account
                    </button>
<button class="px-lg py-sm rounded-lg bg-primary hover:bg-primary/90 text-on-primary font-body-sm text-body-sm font-medium transition-colors w-full sm:w-auto text-center shadow-sm">
                        Save
                    </button>
</div>
</div>
</main>
</div>


</body></html>
